<!-- ======================================================
    CATÁLOGO
====================================================== -->

<section class="catalog-page">

    <!-- Encabezado -->

    <div class="catalog-header">

        <h1>

            Catálogo de Productos

        </h1>

        <p>

            Encuentra la mejor tecnología para tu computador.

        </p>

    </div>

    <!-- Contenido -->

    <div class="catalog-container">

        <!-- Panel de filtros -->

        <app-catalog-filters
        (filtersChange)="applyFilters($event)">
            
        </app-catalog-filters>



        <!-- ======================================================
    ZONA DE PRODUCTOS
====================================================== -->

<section class="catalog-content">

    <!-- Título -->
    <h2>

        Productos disponibles

    </h2>

    <!-- Controles de ordenamiento precio -->

<div class="sort-container">

    <label for="sort">
        Ordenar por:
    </label>

    <select
        id="sort"
        [(ngModel)]="sortOrder"
        (change)="sortProducts()">

        <option value="relevance">
            Más relevantes
        </option>

        <option value="price-asc">
            Precio: menor a mayor
        </option>

        <option value="price-desc">
            Precio: mayor a menor
        </option>

    </select>

</div>


    <!-- ======================================================
    BUSCADOR DEL CATÁLOGO
====================================================== -->

<app-catalog-search (searchChange)="onSearch($event)"></app-catalog-search>



    <!-- Grid de productos -->

    <div class="products-grid">

        <app-product-card

            *ngFor="let product of filteredProducts"

            [product]="product">

        </app-product-card>

    </div>

</section>

</div> <!-- Fin de catalog-container -->

</section> <!-- Fin de catalog-page -->
