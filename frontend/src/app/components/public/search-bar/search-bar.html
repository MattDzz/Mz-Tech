<!-- ===========================
    BARRA DE BÚSQUEDA
=========================== -->

<section class="search-container">

    <div class="search-box">

        <!-- Campo de búsqueda -->
        <input
            type="text"
            placeholder="Buscar productos..."
            [(ngModel)]="search"
        >

        <!-- Botón -->
        <button
        type="button"
        (click)="onSearch()"
        >

            🔍 Buscar

        </button>

    </div>

</section>
